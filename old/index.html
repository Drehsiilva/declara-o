        font-size: 0.6em;
    }

    /* Ajusta as figuras e fotos para empilhar */
    figure {
        width: 90%; /* Faz cada foto ocupar 90% da tela, uma embaixo da outra */
        margin: 20px auto; /* Centraliza a figura na tela */
        display: block; /* Garante que elas fiquem empilhadas */
    }
    
    /* A imagem dentro da figura deve ocupar 100% do espaço da figura */
    figure img {
        width: 100%;
        height: auto; /* A altura se ajusta automaticamente para não distorcer */
    }
    
    /* A legenda agora também ocupa a largura da figura, sem valor fixo */
    figcaption {
        width: auto; /* Remove a largura fixa para se ajustar ao novo tamanho */
        margin-left: 10px;
        margin-right: 10px;
    }
}

<div>

    <h1 style="font-size: 3.5em;">Nosso Tempo Juntos ❤️</h1>
    <div id="contador">Calculando nosso tempo...</div>

    <script>
        // --- IMPORTANTE: MUDE APENAS A LINHA ABAIXO ---
        // Formato: Ano, Mês (Janeiro=0, Fevereiro=1...), Dia, Hora, Minuto, Segundo
        const dataInicio = new Date('2024-09-09T13:36:00'); // Exemplo: 27 de Outubro de 2022, às 20:00

        function atualizarContador() {
            const agora = new Date();
            const diferenca = agora - dataInicio;

            // Cálculos de tempo
            const segundosTotal = Math.floor(diferenca / 1000);
            const minutosTotal = Math.floor(segundosTotal / 60);
            const horasTotal = Math.floor(minutosTotal / 60);

            const anos = Math.floor(horasTotal / (24 * 365.25));
            const diasRestantes = Math.floor((horasTotal / 24) % 365.25);
            const horas = horasTotal % 24;
            const minutos = minutosTotal % 60;
            const segundos = segundosTotal % 60;

            // Monta o texto que será exibido
            const texto = `
                ${anos} anos, ${diasRestantes} dias, <br>
                ${horas} horas, ${minutos} minutos e ${segundos} segundos.
            `;

            // Atualiza o elemento na tela
            document.getElementById('contador').innerHTML = texto;
        }

        // Faz o contador atualizar a cada segundo
        setInterval(atualizarContador, 1000);

        // Roda a função uma vez assim que a página carrega
        atualizarContador();
    </script>
